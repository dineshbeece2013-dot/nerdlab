/* ---------- the code editor used by "write" tasks and the lab ---------- */
function buildEditor(spec, onCheck){
  const box = document.createElement('div');
  box.className = 'edwrap';
  box.innerHTML = '<div class="edbar">FILE <b>'+spec.file+'</b> &nbsp;·&nbsp; spaces only, never tabs &nbsp;·&nbsp; Tab key inserts 2 spaces</div>';
  const ta = document.createElement('textarea');
  ta.className = 'editor'; ta.spellcheck = false;
  ta.placeholder = spec.placeholder || '';
  box.appendChild(ta);

  ta.addEventListener('keydown', e=>{
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0,s) + '  ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 2;
      ta.dispatchEvent(new Event('input'));
    }
  });

  const reqBox = document.createElement('div');
  reqBox.className = 'reqs';
  reqBox.innerHTML = '<div class="lab">Requirements — these tick as you type</div><div class="reqlist"></div>';

  const errBox = document.createElement('div');
  errBox.style.display = 'none';
  errBox.className = 'parseerr';

  function evaluate(){
    const text = ta.value;
    let reqs = null, perr = null;
    if(spec.raw){
      try { reqs = spec.check(null, text); } catch(e){ reqs = []; }
    } else if(!text.trim()){
      /* empty editor: show the checklist with nothing ticked, and no scary error yet */
      try { reqs = spec.check(null, ''); } catch(e){ reqs = null; }
    } else {
      try { reqs = spec.check(parseYAML(text), text); }
      catch(e){ perr = e; reqs = null; }
    }
    /* nothing has been written yet, so nothing is known to be true —
       .every() on an empty list would otherwise tick by itself */
    if(!text.trim() && reqs) reqs = reqs.map(function(r){ return {ok:false, text:r.text}; });

    if(perr){
      errBox.style.display = '';
      errBox.innerHTML = '<b>YAML problem on line '+perr.line+'.</b><br>'+perr.msg;
    } else {
      errBox.style.display = 'none';
    }
    const list = reqBox.querySelector('.reqlist');
    if(perr){
      /* Do NOT leave the old ticks on screen — the file cannot be read, so nothing is known to be true. */
      list.innerHTML = '<div class="req off"><span class="mk">—</span><span>Cannot check the requirements until the YAML above is fixed.</span></div>';
    } else if(reqs){
      list.innerHTML = reqs.map(r=>
        '<div class="req '+(r.ok?'on':'off')+'"><span class="mk">'+(r.ok?'✓':'○')+'</span><span>'+r.text+'</span></div>').join('');
    }
    return {reqs, perr};
  }

  let t = null;
  ta.addEventListener('input', ()=>{ clearTimeout(t); t = setTimeout(evaluate, 250); });

  return {box, ta, reqBox, errBox, evaluate};
}

function render(ch){
  const box = add('', 'chal');
  const tag = ch.boss ? 'FINAL CHALLENGE' :
              ch.type === 'mc' ? 'Decision' :
              ch.type === 'cmd' ? 'Terminal' :
              ch.type === 'write' ? 'Type it yourself' : 'Fill in the playbook';
  let body = '<div class="tag">'+tag+' · '+ch.xp+' XP</div><div class="q">'+ch.q+'</div>';

  /* ---- multiple choice ---- */
  if(ch.type === 'mc'){
    body += '<div class="opts">' + ch.options.map((o,i)=>
      '<button class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. &nbsp;'+o+'</button>').join('') + '</div>';
    box.innerHTML = body;
    box.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick = ()=>{
        const i = +btn.dataset.i;
        box.querySelectorAll('.opt').forEach(b=> b.disabled = true);
        if(i === ch.correct){ btn.classList.add('right'); good(box, ch); }
        else {
          btn.classList.add('wrong');
          box.querySelectorAll('.opt')[ch.correct].classList.add('right');
          bad(box, ch, null);
        }
      };
    });
  }

  /* ---- terminal ---- */
  else if(ch.type === 'cmd'){
    body += (ch.shape ? '<div class="shape">Shape: '+ch.shape+'</div>' : '')
         +  '<div class="term"><span>$</span><input type="text" spellcheck="false" autocomplete="off" placeholder="tap the chips below, or type it yourself…"></div>';
    box.innerHTML = body;
    const inp = box.querySelector('input');
    if(ch.bank) box.appendChild(makeBank(ch.bank, (t,b)=>{
      inp.value = (inp.value.trim() + ' ' + t).trim(); b.classList.add('used'); focusQuiet(inp);
    }));
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<button class="btn" data-go>Execute</button><button class="btn ghost" data-hint>Hint</button><button class="btn ghost" data-clear>Clear</button>';
    box.appendChild(r);
    const go = ()=>{
      const val = inp.value.trim(); if(!val) return;
      if(ch.answers.some(a=> normCmd(a) === normCmd(val))){
        inp.disabled = true; box.querySelectorAll('.btn, .tok').forEach(b=> b.disabled = true);
        good(box, ch);
      } else {
        bad(box, ch, ()=>{
          inp.value = ch.answers[0]; inp.disabled = true;
          box.querySelectorAll('.btn, .tok').forEach(b=> b.disabled = true);
        }, ch.answers[0]);
      }
    };
    box.querySelector('[data-go]').onclick = go;
    box.querySelector('[data-hint]').onclick = ()=> showHint(box, ch);
    box.querySelector('[data-clear]').onclick = ()=>{
      inp.value=''; box.querySelectorAll('.tok').forEach(t=> t.classList.remove('used')); focusQuiet(inp);
    };
    inp.addEventListener('keydown', e=>{ if(e.key === 'Enter') go(); });
    setTimeout(()=> focusQuiet(inp), 120);
  }

  /* ---- type it yourself ---- */
  else if(ch.type === 'write'){
    box.innerHTML = body;
    const ed = buildEditor(ch);
    box.appendChild(ed.box);
    box.appendChild(ed.errBox);
    box.appendChild(ed.reqBox);
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<button class="btn" data-go>Check my file</button><button class="btn ghost" data-hint>Hint</button><button class="btn ghost" data-clear>Clear</button>';
    box.appendChild(r);
    ed.evaluate();
    const go = ()=>{
      const {reqs, perr} = ed.evaluate();
      if(!perr && reqs && reqs.every(x=> x.ok)){
        ed.ta.disabled = true;
        box.querySelectorAll('.btn').forEach(b=> b.disabled = true);
        good(box, ch);
      } else {
        const missing = perr ? null : reqs.filter(x=> !x.ok);
        bad(box, ch, ()=>{
          ed.ta.value = ch.solution; ed.evaluate(); ed.ta.disabled = true;
          box.querySelectorAll('.btn').forEach(b=> b.disabled = true);
        }, ch.solution,
        perr ? ('YAML could not be read — see the message above line '+perr.line+'.')
             : ('Still missing: <ul><li>'+missing.map(m=>m.text).join('</li><li>')+'</li></ul>'));
      }
    };
    box.querySelector('[data-go]').onclick = go;
    box.querySelector('[data-hint]').onclick = ()=> showHint(box, ch);
    box.querySelector('[data-clear]').onclick = ()=>{ ed.ta.value=''; ed.evaluate(); focusQuiet(ed.ta); };
    setTimeout(()=> focusQuiet(ed.ta), 120);
  }

  /* ---- fill in the blanks ---- */
  else {
    let code = esc(ch.code).replace(/\n/g,'<br>').replace(/ /g,'&nbsp;');
    ch.blanks.forEach((b,i)=>{
      code = code.replace('@'+(i+1)+'@',
        '<input class="blank" data-i="'+i+'" size="'+(b.w||10)+'" spellcheck="false" autocomplete="off">');
    });
    body += '<pre>'+code+'</pre>';
    box.innerHTML = body;
    const inputs = [...box.querySelectorAll('.blank')];
    let focused = 0;
    inputs.forEach((inp,i)=> inp.addEventListener('focus', ()=> focused = i));
    if(ch.bank) box.appendChild(makeBank(ch.bank, t=>{
      let target = inputs[focused];
      if(!target || target.value.trim()) target = inputs.find(i=> !i.value.trim()) || inputs[focused];
      if(target){ target.value = t; target.classList.remove('no'); focusQuiet(target); }
    }));
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<button class="btn" data-go>Apply</button><button class="btn ghost" data-hint>Hint</button><button class="btn ghost" data-clear>Clear</button>';
    box.appendChild(r);
    const go = ()=>{
      let all = true, right = 0;
      inputs.forEach((inp,i)=>{
        const ok = ch.blanks[i].a.some(a=> normFill(a) === normFill(inp.value));
        inp.classList.toggle('ok', ok); inp.classList.toggle('no', !ok);
        if(ok) right++; else all = false;
      });
      if(all){
        inputs.forEach(i=> i.disabled = true);
        box.querySelectorAll('.btn, .tok').forEach(b=> b.disabled = true);
        good(box, ch);
      } else {
        bad(box, ch, ()=>{
          inputs.forEach((inp,i)=>{
            inp.value = ch.blanks[i].a[0]; inp.disabled = true;
            inp.classList.add('ok'); inp.classList.remove('no');
          });
          box.querySelectorAll('.btn, .tok').forEach(b=> b.disabled = true);
        }, null,
        inputs.length > 1 ? right+' of '+inputs.length+' correct — green ones are right, fix the red.' : 'Not that one. Try another chip.');
      }
    };
    box.querySelector('[data-go]').onclick = go;
    box.querySelector('[data-hint]').onclick = ()=> showHint(box, ch);
    box.querySelector('[data-clear]').onclick = ()=>{
      inputs.forEach(i=>{ i.value=''; i.classList.remove('ok','no'); }); focusQuiet(inputs[0]);
    };
    inputs.forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key === 'Enter') go(); }));
    setTimeout(()=> focusQuiet(inputs[0]), 120);
  }
}

function showHint(box, ch){
  if(S.hinted) return;
  S.hinted = true;
  const hb = box.querySelector('[data-hint]'); if(hb) hb.disabled = true;
  const d = document.createElement('div');
  d.className = 'fb hint'; d.innerHTML = '<b>Hint.</b> ' + ch.hint;
  box.appendChild(d); bringIntoView(d);
}
function good(box, ch){
  const earned = Math.max(10, ch.xp - S.tries * 5);
  award(earned);
  const d = document.createElement('div');
  d.className = 'fb good';
  d.innerHTML = '<span class="lead"><b>Correct. +'+earned+' XP</b></span>' + ch.why;
  box.appendChild(d);
  cont(box);
}
function bad(box, ch, showAnswer, answer, extra){
  S.tries++;
  damage(TUNE.damage);
  const d = document.createElement('div');
  d.className = 'fb bad';
  if(S.tries >= TUNE.triesBeforeReveal && ch.type !== 'mc'){
    award(TUNE.revealXP);
    d.innerHTML = '<span class="lead"><b>Here it is — +'+TUNE.revealXP+' XP for sticking with it.</b></span>' +
                  (answer ? '<pre>'+esc(answer)+'</pre>' : '') + ch.why;
    box.appendChild(d);
    if(showAnswer) showAnswer();
    cont(box);
  } else if(ch.type === 'mc'){
    d.innerHTML = '<span class="lead"><b>Not that one.</b></span>' + ch.why;
    box.appendChild(d);
    cont(box);
  } else {
    const left = TUNE.triesBeforeReveal - S.tries;
    d.innerHTML = '<span class="lead"><b>Not yet.</b> ('+left+' more '+(left===1?'try':'tries')+', then I show you.)</span>' +
                  (extra || 'Try again.');
    box.appendChild(d);
    setTimeout(()=>{ if(d.parentNode) d.remove(); }, 9000);
    bringIntoView(d);
  }
}
function cont(box){
  const c = CHAPTERS[S.ch];
  const last = S.q >= c.ch.length - 1;
  const r = document.createElement('div'); r.className = 'row';
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = last ? 'Finish chapter '+c.id+' →' : 'Next challenge →';
  b.onclick = ()=>{ S.q++; askNext(); };
  r.appendChild(b); box.appendChild(r); bringIntoView(r);
  setTimeout(()=> focusQuiet(b), 100);
}

/* The debrief closes the work. It says nothing about fragments —
   recovery is its own screen, reached from here. */
function endChapter(){
  const c = CHAPTERS[S.ch];
  const last = S.ch === CHAPTERS.length - 1;
  if(!S.done.includes(S.ch)) S.done.push(S.ch);
  hud(); screen(); toTop();
  add(crumb('Debrief'));
  c.outro.forEach(line);
  add('<div class="tag">'+(last ? 'Chapters complete — one thing left' : 'Chapter '+c.id+' complete')+
      '</div><div class="q">Rank: <b style="color:var(--purple)">'+
      rankOf()+'</b> · '+S.xp+' XP</div>','chal');

  if(c.relic) nextBtn('Search the code history →', showFragment);
  else nextBtn('Continue →', afterFragment);
  toTop();
}

/* ============================================================
   FRAGMENT RECOVERY — a screen of its own.
   Nothing about scores, tries or answers appears here. One
   commit from Emma, the collection so far, and a way onward.
   ============================================================ */
function showFragment(){
  const c = CHAPTERS[S.ch];
  if(!S.frags.some(f=> f.sha === c.relic.sha)) S.frags.push(c.relic);
  const n = QUEST.fragOffset + S.frags.length;
  hud(); screen(); toTop();

  add('<div class="crumb blk">Code history &nbsp;·&nbsp; <b>Fragment recovery</b> &nbsp;·&nbsp; chapter '+c.id+'</div>');
  add(esc('$ git log --author=emma --reverse\nsearching 11 years of history…\n1 commit recovered.')
        .replace(/\n/g,'<br>'), 'frag-scan');

  add('<div class="fr-k">Fragment '+n+' of '+QUEST.fragTotal+' recovered</div>'+
      '<div class="fr-sha">commit '+c.relic.sha+'</div>'+
      '<div class="fr-meta">Author: Emma &nbsp;·&nbsp; Date: '+c.relic.date+'</div>'+
      '<div class="fr-msg">'+c.relic.msg+'</div>'+
      '<div class="fr-pips">'+Array.from({length:QUEST.fragTotal},(_,i)=>
        '<i class="'+(i < n ? (i < QUEST.fragOffset ? 'on past' : 'on') : '')+'"></i>').join('')+'</div>'+
      '<div class="fr-foot">'+(n === QUEST.fragTotal
        ? 'Every fragment recovered.'
        : (QUEST.fragTotal - n)+' still buried in the history.')+'</div>', 'fragcard');

  nextBtn('Close the log →', afterFragment);
  toTop();
}

/* Where the story picks back up after the fragment screen. */
function afterFragment(){
  const c = CHAPTERS[S.ch];
  if(S.ch === CHAPTERS.length - 1) return startLab();
  screen(); toTop();
  add(crumb('Next'));
  if(c.hook) add(c.hook, 'narr');
  nextBtn('Chapter '+(c.id+1)+': '+CHAPTERS[S.ch+1].title+' →', ()=> startChapter(S.ch + 1));
  toTop();
}

/* ============================================================
   THE LAB
   ============================================================ */
function startLab(){
  S.lab = true; hud(); screen(); toTop();
  add('<div class="k">CAPSTONE</div><h2>'+LAB.title+'</h2><p>'+
      (LAB.twice ? 'Write it from nothing, then run it twice.' : 'Write it from nothing, then run it.')+
      '</p>','chaptercard');
  LAB.story.forEach(line);
  nextBtn('Open the editor →', labEditor);
  toTop();
}
function labEditor(){
  screen(); toTop();
  add('<div class="crumb blk">Capstone &nbsp;·&nbsp; <b>'+LAB.title+'</b> &nbsp;·&nbsp; test environment, '+
      simFleet().length+' machines</div>');
  const det = document.createElement('details');
  det.className = 'manual blk';
  det.innerHTML = '<summary>Everything you have learned — quick reference</summary><div class="inner"><table class="cheat">'+
    CHEATSHEET.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+b+'</td></tr>').join('')+'</table></div>';
  log.appendChild(det);

  const box = add('<div class="tag">Capstone · '+LAB.xp+' XP</div><div class="q">'+LAB.q+'</div>', 'chal');
  const ed = buildEditor(LAB);
  box.appendChild(ed.box);
  box.appendChild(ed.errBox);
  box.appendChild(ed.reqBox);
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = '<button class="btn" data-run>▶ Run playbook</button>'+
                '<button class="btn ghost" data-hint>Hint</button>'+
                '<button class="btn ghost" data-sol>Show a working answer</button>';
  box.appendChild(r);
  ed.evaluate();

  let ran = 0;
  const outHost = document.createElement('div');
  box.appendChild(outHost);

  box.querySelector('[data-run]').onclick = ()=>{
    const {reqs, perr} = ed.evaluate();
    outHost.innerHTML = '';
    if(perr){
      const d = document.createElement('div'); d.className = 'runout';
      d.innerHTML = '<span class="rr">ERROR! Syntax Error while loading YAML.\n  line '+perr.line+'\n\n'+
                    esc(perr.msg.replace(/<[^>]+>/g,''))+'</span>';
      outHost.appendChild(d); bringIntoView(d); return;
    }
    const missing = reqs.filter(x=> !x.ok);
    if(missing.length){
      const d = document.createElement('div'); d.className = 'fb bad';
      d.innerHTML = '<span class="lead"><b>It parses, but it is not finished yet.</b></span>'+
                    'Still missing: <ul><li>'+missing.map(m=>m.text).join('</li><li>')+'</li></ul>';
      outHost.appendChild(d); bringIntoView(d);
      return;
    }
    const doc = parseYAML(ed.ta.value);
    ran++;
    const first = simulate(doc, 1);
    const d1 = document.createElement('div'); d1.className = 'runout';
    d1.innerHTML = '<span class="rk">$ ansible-playbook -i inventory.ini '+LAB.file+'</span>\n\n' + first.join('\n');
    outHost.appendChild(d1);

    let second = null;
    if(LAB.twice){
      second = simulate(doc, 2);
      const d2 = document.createElement('div'); d2.className = 'runout';
      d2.innerHTML = '<span class="rk">$ ansible-playbook -i inventory.ini '+LAB.file+'   # second run</span>\n\n' + second.join('\n');
      outHost.appendChild(d2);
    }

    const clean = !LAB.twice ||
      (/changed=0/.test(second.join('\n')) && !/changed=[1-9]/.test(second.slice(-5).join('\n')));
    const v = document.createElement('div');
    if(clean){
      v.className = 'fb good';
      v.innerHTML = LAB.twice
        ? '<span class="lead"><b>Second run: changed=0 on every machine.</b></span>'+
          'That is the proof Dev asked for. Your playbook did the work once and then did nothing, which means it is safe to run '+
          'every hour forever. Everything in it described a <i>result</i>, so once the result was true there was nothing left to do.'
        : '<span class="lead"><b>It ran. Every play, every machine, no errors.</b></span>'+
          'You went from an empty file to something Ansible could execute, and you did it without a single blank to fill in. '+
          'Notice that each play only touched the machines in its own group — that is the inventory doing its job.';
      const rr = document.createElement('div'); rr.className = 'row';
      const bb = document.createElement('button'); bb.className = 'btn';
      bb.textContent = LAB.runBtn || 'Deploy to all 400 machines →';
      bb.onclick = ()=>{ award(LAB.xp); labDone(); };
      rr.appendChild(bb); v.appendChild(rr);
      box.querySelector('[data-run]').textContent = '▶ Run again';
    } else {
      v.className = 'fb hint';
      v.innerHTML = '<span class="lead"><b>The second run still reports changes.</b></span>'+
        'Something in the playbook does work it did not need to do. Look for <code>state: latest</code>, or a '+
        '<code>command</code> task with no <code>creates:</code> — those are the two usual causes.';
    }
    outHost.appendChild(v);
    bringIntoView(v);
  };
  box.querySelector('[data-hint]').onclick = ()=>{
    const d = document.createElement('div');
    d.className = 'fb hint'; d.innerHTML = '<b>Hint.</b> ' + LAB.hint;
    box.appendChild(d); bringIntoView(d);
  };
  box.querySelector('[data-sol]').onclick = ()=>{
    ed.ta.value = LAB.solution; ed.evaluate(); focusQuiet(ed.ta);
    const d = document.createElement('div');
    d.className = 'fb hint';
    d.innerHTML = '<b>One working answer loaded.</b> Read it, change something, and run it — try setting '+
                  '<code>state: latest</code> and watch what the second run does.';
    box.appendChild(d); bringIntoView(d);
  };
  toTop();
}
/* The capstone is done. The rank is earned here, not at the last chapter. */
function labDone(){
  S.labDone = true;
  hud(); screen(); toTop();
  add('<div class="crumb blk">'+LAB.doneCrumb+'</div>');
  LAB.done.forEach(line);
  nextBtn(LAB.doneBtn, QUEST.isFinal ? finale : questComplete);
  toTop();
}

/* ============================================================
   END OF QUEST — the promotion, the completion code, and the
   handoff to the next file.
   ============================================================ */
function questComplete(){
  const code = completionCode();
  const veil = document.createElement('div'); veil.className = 'veil';
  veil.innerHTML =
    '<div class="card">'+
    '<h1>ANSIBLE QUEST '+QUEST.roman+'</h1><h2>'+QUEST.title+' · complete</h2>'+
    '<div class="promo"><div class="promo-k">Qualified</div>'+
    '<div class="promo-r">'+QUEST.rankStart+' &nbsp;→&nbsp; <b>'+QUEST.rankEnd+'</b></div></div>'+
    '<p><b>'+S.xp+' XP</b> · server uptime <b>'+S.up+'%</b> · '+
      (QUEST.fragOffset + S.frags.length)+' of '+QUEST.fragTotal+' fragments recovered</p>'+
    '<div class="codebox"><div class="code-k">Completion code — hand this in</div>'+
    '<div class="code-v" id="q-code">'+code+'</div>'+
    '<button class="btn ghost" id="q-copy">Copy</button></div>'+
    (NEXT_UP ? '<p>'+NEXT_UP+'</p>' : '')+
        '<div class="row"><button class="btn ghost" id="q-frag">Read the fragments</button>'+
    '<button class="btn ghost" id="q-note">Open the notebook</button>'+
    '<button class="btn ghost" id="q-again">Play this quest again</button></div></div>';
  document.body.appendChild(veil);
  veil.querySelector('#q-again').onclick = ()=> location.reload();
  veil.querySelector('#q-frag').onclick  = ()=>{ veil.remove(); openFrags(); };
  veil.querySelector('#q-note').onclick  = ()=>{ veil.remove(); openNotebook(); };
  veil.querySelector('#q-copy').onclick  = function(){
    const b = this;
    try{ navigator.clipboard.writeText(code); b.textContent = 'Copied'; }
    catch(e){
      const r = document.createRange(); r.selectNode(veil.querySelector('#q-code'));
      window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
      b.textContent = 'Selected — press Ctrl+C';
    }
  };
}

/* ---------- overlays ---------- */
function overlay(inner){
  const veil = document.createElement('div'); veil.className = 'veil';
  veil.innerHTML = '<div class="card">'+inner+'<div class="row"><button class="btn" id="x">Close</button></div></div>';
  document.body.appendChild(veil);
  veil.querySelector('#x').onclick = ()=> veil.remove();
  veil.onclick = e=>{ if(e.target === veil) veil.remove(); };
  return veil;
}
function openNotebook(){
  overlay('<h1 style="font-size:20px">EMMA\'S NOTEBOOK</h1>'+
    '<p class="dim">Everything the game has taught you, on one page.</p><table class="cheat">'+
    CHEATSHEET.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+b+'</td></tr>').join('')+'</table>');
}
function openFrags(){
  const body = S.frags.length
    ? S.frags.map(f=>'<div class="relic"><div class="sha">commit '+f.sha+' · '+f.date+'</div><div class="msg">"'+f.msg+'"</div></div>').join('')
    : '<p class="dim">No fragments yet. Finish a chapter, then search the code history.</p>';
  overlay('<h1 style="font-size:20px">RECOVERED FRAGMENTS</h1>'+
    '<p class="dim">'+(QUEST.fragOffset + S.frags.length)+' of '+QUEST.fragTotal+' saved notes recovered from the code history.</p>'+body);
}
function openMap(){
  const reachedMax = Math.max.apply(null, S.done.concat([S.ch]));
  const chips = CHAPTERS.map((c,i)=>{
    const reached = i <= reachedMax;
    const cls = S.done.includes(i) ? 'chip done' : reached ? 'chip' : 'chip locked';
    return '<button class="'+cls+'" data-i="'+i+'"'+(reached?'':' disabled')+'>'+c.id+'. '+c.title+'</button>';
  }).join('') + (S.done.length === CHAPTERS.length ? '<button class="chip done" data-i="lab">★ '+LAB.title+'</button>' : '');
  const veil = overlay('<h1 style="font-size:20px">CHAPTERS</h1>'+
    '<p class="dim">Jump to any chapter you have reached. Progress lives in this tab only — refreshing starts over.</p>'+
    '<div class="chips">'+chips+'</div>');
  veil.querySelectorAll('.chip:not(.locked)').forEach(b=>{
    b.onclick = ()=>{
      veil.remove();
      if(b.dataset.i === 'lab') startLab(); else startChapter(+b.dataset.i);
    };
  });
}

document.getElementById('b-note').onclick = openNotebook;
document.getElementById('b-map').onclick  = openMap;
document.getElementById('b-frag').onclick = openFrags;

/* ---------- title ---------- */
(function title(){
  const veil = document.createElement('div'); veil.className = 'veil';
  veil.innerHTML =
    '<div class="card">'+
    '<h1>ANSIBLE QUEST '+QUEST.roman+'</h1><h2>'+QUEST.title+'</h2>'+
    '<div class="promo"><div class="promo-k">'+
      (QUEST.roman ? 'Part '+QUEST.n+' of '+QUEST.of+' &nbsp;·&nbsp; chapters '+QUEST.chFrom+'–'+QUEST.chTo+' of '+QUEST.chTotal
                   : 'Complete edition &nbsp;·&nbsp; all '+QUEST.chTotal+' chapters')+'</div>'+
    '<div class="promo-r">'+QUEST.rankStart+' &nbsp;→&nbsp; <b>'+QUEST.rankEnd+'</b></div></div>'+
    '<p>'+STORY_SO_FAR+'</p>'+
    '<div class="promo-k" style="margin-top:16px">By the end of this quest you can</div>'+
    '<ul class="cando">'+QUEST_CAN+'</ul>'+
    '<p>'+QUEST_GOAL+' Every chapter ends by making you <b>type the whole file yourself</b>, with a checklist that ticks as you go. '+
    'The quest finishes in a lab: an empty editor and a simulator that really runs what you write.</p>'+
    '<p class="dim">Hints are free. Three tries before the answer is shown. A wrong answer costs server uptime, never progress, so you cannot get stuck. '+
    'Each chapter unlocks one piece of her story.</p>'+
    '<div class="row"><button class="btn" id="go">'+START_LABEL+'</button>'+
    '<button class="btn ghost" id="nb">Notebook</button></div></div>';
  document.body.appendChild(veil);
  veil.querySelector('#go').onclick = ()=>{ veil.remove(); hud(); startChapter(0); };
  veil.querySelector('#nb').onclick = openNotebook;
  setTimeout(()=> focusQuiet(veil.querySelector('#go')), 150);
})();
</script>

<script>
/* ============================================================
   Simulator upgrade.
   A rolling upgrade needs batches, pre/post sections, delegation
   and error-handling blocks, so this replaces simulate().
   ============================================================ */

NOT_MODULE.push('until','retries','delay','run_once','block','rescue','always','listen',
                'no_log','check_mode','environment','throttle','any_errors_fatal',
                'delegate_facts','async','poll','serial','max_fail_percentage','retry_files');

/* block / rescue / always -> a flat list. Nothing fails in the simulator,
   so the rescue branch is reported as skipped and always still runs. */
function flatTasks(list){
  const out = [];
  Y.list(list).forEach(t=>{
    if(t && typeof t === 'object' && Array.isArray(t.block)){
      flatTasks(t.block).forEach(x=> out.push(x));
      if(Array.isArray(t.rescue)) flatTasks(t.rescue).forEach(x=> out.push({__skip:x}));
      if(Array.isArray(t.always)) flatTasks(t.always).forEach(x=> out.push(x));
    } else if(t){
      out.push(t);
    }
  });
  return out;
}

function batchSize(serial, total){
  if(serial === undefined || serial === null || serial === '') return total;
  const s = String(serial).trim();
  if(s.slice(-1) === '%'){
    const pct = parseFloat(s.slice(0,-1));
    return Math.max(1, Math.ceil(total * pct / 100));
  }
  const n = parseInt(s,10);
  return (isNaN(n) || n < 1) ? total : Math.min(n, total);
}

function simulate(doc, runNo){
  const out   = [];
  const plays = Y.plays(doc);
  if(!plays.length) return ['ERROR! playbook must be a list of plays'];
  const order = [], recap = {};
  const touch = h =>{
    if(!recap[h.name]){ recap[h.name] = {ok:0, changed:0, skipped:0}; order.push(h.name); }
    return recap[h.name];
  };
  const first = runNo === 1;

  plays.forEach((play, pi)=>{
    if(pi) out.push('');
    const all = simHosts(play.hosts);
    if(!all.length){
      out.push('<span class="rk">'+pad('PLAY ['+(play.name || 'play')+']', 60)+'</span>');
      out.push('<span class="ry">skipping: no hosts matched \''+String(play.hosts)+'\'</span>');
      return;
    }
    const size    = batchSize(play.serial, all.length);
    const batches = [];
    for(let i=0;i<all.length;i+=size) batches.push(all.slice(i,i+size));

    batches.forEach((hosts, bi)=>{
      if(bi) out.push('');
      const label = 'PLAY ['+(play.name || 'play')+']'+
                    (batches.length > 1 ? '  (batch '+(bi+1)+' of '+batches.length+')' : '');
      out.push('<span class="rk">'+pad(label, 60)+'</span>');
      out.push('');

      if(play.gather_facts === undefined || play.gather_facts === null || Y.yes(play.gather_facts)){
        out.push('<span class="rk">'+pad('TASK [Gathering Facts]', 60)+'</span>');
        hosts.forEach(h=>{ out.push('<span class="rg">ok: ['+h.name+']</span>'); touch(h).ok++; });
      }

      let notified = [];

      const runHandlers = ()=>{
        Y.handlers(play).forEach(hd=>{
          if(notified.indexOf(hd.name) === -1) return;
          out.push('');
          out.push('<span class="rk">'+pad('RUNNING HANDLER ['+hd.name+']', 60)+'</span>');
          hosts.forEach(host=>{
            out.push('<span class="rc">changed: ['+host.name+']</span>');
            touch(host).ok++; touch(host).changed++;
          });
        });
        notified = [];
      };

      const runTask = t=>{
        if(t && t.__skip){
          const s = Y.mod(t.__skip);
          if(!s.short) return;
          out.push('');
          out.push('<span class="rk">'+pad('TASK ['+(t.__skip.name || s.short)+']', 60)+'</span>');
          out.push('<span class="ry">skipping: rescue block — nothing failed</span>');
          return;
        }
        const m = Y.mod(t);
        if(!m.short) return;

        /* meta: flush_handlers moves the queued handlers to right here */
        if(m.short === 'meta'){
          if(String(m.val).indexOf('flush_handlers') >= 0){
            out.push('');
            out.push('<span class="rk">'+pad('META [flush_handlers]', 60)+'</span>');
            runHandlers();
          }
          return;
        }

        out.push('');
        out.push('<span class="rk">'+pad('TASK ['+(t.name || m.short)+']', 60)+'</span>');

        /* would this task change anything on a second run? */
        let changes;
        if(String(t.changed_when).trim() === 'false' || t.changed_when === false) changes = false;
        else if(['debug','uri','wait_for','assert','stat','command_check'].indexOf(m.short) >= 0) changes = false;
        else if(first) changes = true;
        else if(['apt','dnf','yum','package'].indexOf(m.short) >= 0 && Y.eq(Y.arg(t,'state'),'latest')) changes = true;
        else if((m.short === 'command' || m.short === 'shell') && !(t.args && t.args.creates)) changes = true;
        else changes = false;

        const items   = Y.list(t.loop);
        const targets = t.run_once ? hosts.slice(0,1) : hosts;
        const via     = t.delegate_to ? ' -> '+String(t.delegate_to).split('.')[0] : '';

        targets.forEach(h=>{
          if(!simWhen(t.when, h)){
            out.push('<span class="ry">skipping: ['+h.name+']</span>');
            touch(h).skipped++;
            return;
          }
          (items.length ? items : [null]).forEach(it=>{
            const suffix = (it === null ? '' : ' => (item='+it+')');
            if(m.short === 'debug'){
              const msg = (m.val && typeof m.val === 'object') ? (m.val.msg || '') : '';
              out.push('<span class="rg">ok: ['+h.name+'] => {</span>');
              out.push('<span class="rg">    "msg": "'+String(msg)
                .replace(/\{\{\s*ansible_hostname\s*\}\}/g, h.name.split('.')[0])
                .replace(/\{\{\s*inventory_hostname\s*\}\}/g, h.name)
                .replace(/\{\{\s*ansible_facts\[.os_family.\]\s*\}\}/g, h.os_family)+'"</span>');
              out.push('<span class="rg">}</span>');
              touch(h).ok++;
            } else if(t.until){
              out.push('<span class="ry">FAILED - RETRYING: '+(t.name || m.short)+' ('+
                       (parseInt(t.retries,10) || 3)+' retries left)</span>');
              out.push('<span class="rg">ok: ['+h.name+via+']</span>');
              touch(h).ok++;
            } else if(changes){
              out.push('<span class="rc">changed: ['+h.name+via+']'+suffix+'</span>');
              touch(h).ok++; touch(h).changed++;
              const nt = t.notify;
              (Array.isArray(nt) ? nt : (nt ? [nt] : [])).forEach(n=>{
                if(notified.indexOf(n) === -1) notified.push(n);
              });
            } else {
              out.push('<span class="rg">ok: ['+h.name+via+']'+suffix+'</span>');
              touch(h).ok++;
            }
          });
        });
      };

      flatTasks(play.pre_tasks).forEach(runTask);

      Y.list(play.roles).forEach(r=>{
        const nm = (r && typeof r === 'object') ? (r.role || r.name) : r;
        out.push('');
        out.push('<span class="rk">'+pad('TASK ['+nm+' : main]', 60)+'</span>');
        hosts.forEach(h=>{
          out.push('<span class="'+(first?'rc':'rg')+'">'+(first?'changed':'ok')+': ['+h.name+']</span>');
          touch(h).ok++; if(first) touch(h).changed++;
        });
      });

      flatTasks(play.tasks).forEach(runTask);
      flatTasks(play.post_tasks).forEach(runTask);
      runHandlers();
    });
  });

  out.push('');
  out.push('<span class="rk">'+pad('PLAY RECAP', 60)+'</span>');
  order.forEach(n=>{
    const r = recap[n];
    out.push('<span class="'+(r.changed?'rc':'rg')+'">'+n.padEnd(24)+
             ': ok='+r.ok+'    changed='+r.changed+'    unreachable=0    failed=0    skipped='+r.skipped+'</span>');
  });
  return out;
}


/* ---------- UI ---------- */
/* ============================================================
   The capstone does not just run the playbook — it puts it
   through the pipeline: lint, converge, idempotence, verify.
   ============================================================ */

function ciBlock(title, lines){
  return '<div class="runout"><span class="rk">'+esc(title)+'</span>\n\n'+lines.join('\n')+'</div>';
}

function labEditor(){
  screen(); toTop();
  add('<div class="crumb blk">Final capstone &nbsp;·&nbsp; <b>'+LAB.title+'</b> &nbsp;·&nbsp; pipeline, '+
      simFleet().length+' machines</div>');

  const det = document.createElement('details');
  det.className = 'manual blk';
  det.innerHTML = '<summary>Everything you have learned — quick reference</summary><div class="inner"><table class="cheat">'+
    CHEATSHEET.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+b+'</td></tr>').join('')+'</table></div>';
  log.appendChild(det);

  const box = add('<div class="tag">Final capstone · '+LAB.xp+' XP</div><div class="q">'+LAB.q+'</div>', 'chal');
  const ed = buildEditor(LAB);
  box.appendChild(ed.box);
  box.appendChild(ed.errBox);
  box.appendChild(ed.reqBox);

  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = '<button class="btn" data-run>▶ Run the pipeline</button>'+
                '<button class="btn ghost" data-hint>Hint</button>'+
                '<button class="btn ghost" data-sol>Show a working answer</button>';
  box.appendChild(r);
  ed.evaluate();

  const outHost = document.createElement('div');
  box.appendChild(outHost);

  box.querySelector('[data-run]').onclick = ()=>{
    const {reqs, perr} = ed.evaluate();
    outHost.innerHTML = '';

    if(perr){
      outHost.innerHTML = ciBlock('$ yamllint site.yml',
        ['<span class="rr">error  line '+perr.line+'  '+esc(perr.msg.replace(/<[^>]+>/g,''))+'</span>',
         '<span class="rr">PIPELINE FAILED at stage 1 of 4</span>']);
      bringIntoView(outHost); return;
    }
    const missing = reqs.filter(x=> !x.ok);
    if(missing.length){
      const d = document.createElement('div'); d.className = 'fb bad';
      d.innerHTML = '<span class="lead"><b>It parses, but the file is not finished.</b></span>'+
                    'Still missing: <ul><li>'+missing.map(m=> m.text).join('</li><li>')+'</li></ul>';
      outHost.appendChild(d); bringIntoView(d); return;
    }

    const doc  = parseYAML(ed.ta.value);
    const lint = LAB.lint(doc, ed.ta.value);
    const bad  = lint.filter(x=> !x.ok);

    outHost.innerHTML += ciBlock('$ ansible-lint --profile production site.yml',
      lint.map(x=> '<span class="'+(x.ok?'rg':'rr')+'">'+(x.ok?'PASS  ':'FAIL  ')+x.text+'</span>')
          .concat([bad.length
            ? '<span class="rr">\n'+bad.length+' rule(s) failed — PIPELINE STOPPED at stage 2 of 4</span>'
            : '<span class="rg">\n7 rules, 0 failures — stage 2 of 4 passed</span>']));

    if(bad.length){
      const d = document.createElement('div'); d.className = 'fb hint';
      d.innerHTML = '<span class="lead"><b>The playbook runs. The pipeline still says no.</b></span>'+
        'Nothing above is about whether the change works — every one of those rules is about whether the next person can trust it. '+
        'Fix the failures and run it again.';
      outHost.appendChild(d); bringIntoView(d); return;
    }

    const first  = simulate(doc, 1);
    const second = simulate(doc, 2);
    outHost.innerHTML += ciBlock('$ molecule converge', first);

    const s = second.join('\n');
    const clean = /changed=0/.test(s) && !/changed=[1-9]/.test(second.slice(-5).join('\n'));
    outHost.innerHTML += ciBlock('$ molecule idempotence',
      second.slice(-1 - simFleet().length).concat([clean
        ? '<span class="rg">\nidempotence: PASSED — nothing changed on the second run</span>'
        : '<span class="rr">\nidempotence: FAILED — the second run still reports changes</span>']));

    if(!clean){
      const d = document.createElement('div'); d.className = 'fb hint';
      d.innerHTML = '<span class="lead"><b>Stage 3 of 4 failed: idempotence.</b></span>'+
        'Something in the file does work it did not need to do. The usual causes are <code>state: latest</code> and a '+
        '<code>command</code> task with no <code>creates:</code> or <code>changed_when:</code>.';
      outHost.appendChild(d); bringIntoView(d); return;
    }

    outHost.innerHTML += ciBlock('$ molecule verify', [
      '<span class="rg">assert  nginx is installed ......................... ok</span>',
      '<span class="rg">assert  /etc/nginx/app.env is 0600 root:root ...... ok</span>',
      '<span class="rg">assert  nginx enabled and running .................. ok</span>',
      '<span class="rg">assert  no credential literal in site.yml ......... ok</span>',
      '<span class="rg">\nPIPELINE PASSED — 4 of 4 stages</span>']);

    const v = document.createElement('div');
    v.className = 'fb good';
    v.innerHTML = '<span class="lead"><b>Lint clean, converged, idempotent, verified.</b></span>'+
      'This is the difference between a playbook that works and a playbook a company can rely on. It works — that was stage 2. '+
      'It is safe to run again — stage 3. It does what it claims — stage 4. And every one of those answers is produced by a machine, '+
      'on every commit, whether or not you are in the building.';
    const rr2 = document.createElement('div'); rr2.className = 'row';
    const bb = document.createElement('button'); bb.className = 'btn';
    bb.textContent = LAB.runBtn || 'Finish →';
    bb.onclick = ()=>{ award(LAB.xp); labDone(); };
    rr2.appendChild(bb); v.appendChild(rr2);
    outHost.appendChild(v);
    bringIntoView(v);
    box.querySelector('[data-run]').textContent = '▶ Run the pipeline again';
  };

  box.querySelector('[data-hint]').onclick = ()=>{
    const d = document.createElement('div');
    d.className = 'fb hint'; d.innerHTML = '<b>Hint.</b> ' + LAB.hint;
    box.appendChild(d); bringIntoView(d);
  };
  box.querySelector('[data-sol]').onclick = ()=>{
    ed.ta.value = LAB.solution; ed.evaluate(); focusQuiet(ed.ta);
    const d = document.createElement('div');
    d.className = 'fb hint';
    d.innerHTML = '<b>One working answer loaded.</b> Read it, then break it on purpose — change <code>state: present</code> to '+
                  '<code>latest</code>, or delete a <code>mode:</code>, and watch which stage of the pipeline catches you.';
    box.appendChild(d); bringIntoView(d);
  };
  toTop();
}


/* ============================================================
   This file is complete in itself, so the closing screen talks
   about the qualification — nothing before it, nothing after.
   ============================================================ */
function finale(){
  const code = completionCode();
  const veil = document.createElement('div'); veil.className = 'veil';
  veil.innerHTML =
    '<div class="card">'+
    '<h1>ANSIBLE QUEST</h1><h2>'+QUEST.title+' · complete</h2>'+
    '<div class="promo"><div class="promo-k">'+QUEST.chTotal+' chapters · one capstone · qualified</div>'+
    '<div class="promo-r">'+QUEST.rankStart+' &nbsp;→&nbsp; <b>'+QUEST.rankEnd+'</b></div></div>'+
    '<p><b>'+S.xp+' XP</b> · server uptime <b>'+S.up+'%</b> · '+
      S.frags.length+' of '+QUEST.fragTotal+' fragments recovered</p>'+
    '<div class="promo-k" style="margin-top:16px">You can now</div>'+
    '<ul class="cando">'+QUEST_CAN+'</ul>'+
    '<p>You are no longer the person who runs the playbooks. Secrets are out of the repository, dependencies are pinned, and a pipeline proves the work on every commit — whether or not you are in the building.</p>'+
    '<div class="codebox"><div class="code-k">Completion code — hand this in</div>'+
    '<div class="code-v" id="q-code">'+code+'</div>'+
    '<button class="btn ghost" id="q-copy">Copy</button></div>'+
    '<div class="row"><button class="btn ghost" id="q-frag">Read the fragments</button>'+
    '<button class="btn ghost" id="q-note">Open the notebook</button>'+
    '<button class="btn ghost" id="q-again">Play again</button></div></div>';
  document.body.appendChild(veil);
  veil.querySelector('#q-again').onclick = ()=> location.reload();
  veil.querySelector('#q-frag').onclick  = ()=>{ veil.remove(); openFrags(); };
  veil.querySelector('#q-note').onclick  = ()=>{ veil.remove(); openNotebook(); };
  veil.querySelector('#q-copy').onclick  = function(){
    const b = this;
    try{ navigator.clipboard.writeText(code); b.textContent = 'Copied'; }
    catch(e){
      const r = document.createRange(); r.selectNode(veil.querySelector('#q-code'));
      window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
      b.textContent = 'Selected — press Ctrl+C';
    }
  };
}
</script>

<script>
/* ============================================================
   NerdLab bridge. The quest is self-contained; this reports a
   genuine finish (every chapter plus the capstone lab) to the
   platform so points are awarded. Wrapping the two ending
   screens means completion cannot be signalled any other way.
   ============================================================ */
(function () {
  var TASK_ID = 10;
  var reported = false;

  function report() {
    if (reported) return;
    reported = true;
    try {
      window.parent.postMessage({ type: 'TASK_COMPLETED', taskId: TASK_ID }, '*');
    } catch (e) { /* standalone: no parent to tell */ }
  }

  ['finale', 'questComplete'].forEach(function (name) {
    var original = window[name];
    if (typeof original !== 'function') return;
    window[name] = function () {
      var result = original.apply(this, arguments);
      report();
      return result;
    };
  });
})();
</script>
