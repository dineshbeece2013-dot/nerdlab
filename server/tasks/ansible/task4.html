<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANSIBLE QUEST — The Handover</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:#334155;
    --green:#34d399; --green-dim:#10b981; --amber:#fbbf24;
    --cyan:#38bdf8; --red:#f87171; --purple:#c084fc;
    --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1100px 600px at 50% -10%, #1e293b 0%, transparent 60%), var(--bg);
    color:var(--text);
    font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    font-size:15px; line-height:1.6; display:flex; flex-direction:column;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }

  header{
    position:sticky; top:0; z-index:20; background:rgba(15,23,42,.93); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:9px 18px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{font-weight:700; color:var(--green); letter-spacing:2px; font-size:13px}
  .brand small{color:var(--muted); letter-spacing:0; font-weight:400; display:block; font-size:10px}
  .stats{display:flex; gap:14px; margin-left:auto; flex-wrap:wrap; align-items:center}
  .stat{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  .stat b{display:block; font-size:14px; letter-spacing:0; text-transform:none}
  .stat.xp b{color:var(--amber)} .stat.rank b{color:var(--purple)}
  .stat.up b{color:var(--green)} .stat.ch b{color:var(--cyan)} .stat.fr b{color:var(--amber)}
  .bar{width:92px; height:5px; background:#0b1220; border-radius:3px; overflow:hidden; margin-top:5px}
  .bar i{display:block; height:100%; background:var(--green); transition:width .5s ease, background .4s}
  .hbtn{
    background:transparent; border:1px solid var(--line); color:var(--muted); font-family:inherit;
    font-size:10px; padding:6px 10px; border-radius:5px; cursor:pointer; letter-spacing:1px; text-transform:uppercase;
  }
  .hbtn:hover{border-color:var(--green-dim); color:var(--green)}

  main{flex:1; overflow-y:auto; padding:24px 18px 56px}
  .wrap{max-width:840px; margin:0 auto}
  .blk{animation:fade .35s ease both; margin:0 0 14px}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1;transform:none}}

  .crumb{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 0 14px}
  .crumb b{color:var(--green); font-weight:400}

  .chaptercard{
    border:1px solid var(--green-dim); border-left-width:4px;
    background:linear-gradient(90deg,rgba(74,222,128,.07),transparent);
    padding:15px 18px; border-radius:6px; margin:0 0 18px;
  }
  .chaptercard .k{color:var(--green); font-size:11px; letter-spacing:3px}
  .chaptercard h2{margin:6px 0 4px; font-size:21px; color:#f1f5f9; letter-spacing:.5px}
  .chaptercard p{margin:0; color:var(--muted); font-size:13px}

  .dateline{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--amber);
            border-left:2px solid var(--amber); padding-left:10px; opacity:.85}
  .narr{color:var(--text)}
  .sys{color:var(--amber)}
  .sys::before{content:"[SYS] "; color:#a16207}
  .out{color:var(--green-dim); white-space:pre-wrap}
  .npc{border-left:2px solid var(--cyan); padding-left:12px; color:#bae6fd}
  .npc b{color:var(--cyan)}
  code{background:#0b1220; color:var(--amber); padding:1px 6px; border-radius:4px; font-size:.92em}

  .brief{border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:14px 18px; margin:0 0 16px}
  .brief h3{margin:0 0 10px; font-size:12px; letter-spacing:2px; color:var(--cyan); text-transform:uppercase}
  .brief ul{margin:0; padding-left:18px}
  .brief li{margin:6px 0}
  pre{background:#090d16; border:1px solid var(--line); border-radius:6px; padding:12px 14px;
      overflow-x:auto; margin:10px 0; color:#a5f3fc; font-size:13.5px; line-height:1.65}

  /* annotated code walk-through */
  .walk{margin:12px 0 4px; border:1px solid var(--line); border-radius:6px; overflow:hidden}
  .walk .wh{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--cyan);
            padding:8px 12px; background:#090d16; border-bottom:1px solid var(--line)}
  .walk table{width:100%; border-collapse:collapse; font-size:13px; margin:0}
  .walk td{padding:7px 12px; border-bottom:1px solid #16213a; vertical-align:top}
  .walk td:first-child{color:#a5f3fc; white-space:pre; width:47%; background:#090d16; font-size:12.5px}
  .walk td:last-child{color:var(--text); font-size:13px}
  .walk tr:last-child td{border-bottom:0}

  details.manual{border:1px solid var(--line); background:var(--panel); border-radius:6px; margin:0 0 16px}
  details.manual summary{cursor:pointer; padding:9px 14px; font-size:11px; letter-spacing:2px;
    text-transform:uppercase; color:var(--cyan); list-style:none; user-select:none}
  details.manual summary::-webkit-details-marker{display:none}
  details.manual summary::before{content:"\25B8  "}
  details.manual[open] summary::before{content:"\25BE  "}
  details.manual .inner{padding:0 16px 14px}
  details.manual ul{margin:0; padding-left:18px}
  details.manual li{margin:5px 0}

  .relic{border:1px dashed var(--amber); border-radius:6px; background:rgba(251,191,36,.05); padding:12px 16px; margin:0 0 14px}
  .relic .lab{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--amber)}
  .relic .sha{color:var(--muted); font-size:12px; margin-top:6px}
  .relic .msg{color:#fde68a; margin-top:4px; font-style:italic}

  /* ---- fragment recovery screen (its own look, not task feedback) ---- */
  .frag-scan{
    color:var(--green-dim); font-size:12.5px; line-height:1.8;
    border-left:2px solid var(--green-dim); padding-left:12px; margin:0 0 20px;
  }
  .fragcard{
    position:relative; overflow:hidden;
    border:1px solid rgba(251,191,36,.35); border-radius:10px;
    background:
      radial-gradient(420px 180px at 12% -30%, rgba(251,191,36,.13) 0%, transparent 70%),
      rgba(251,191,36,.035);
    padding:24px 26px 20px; margin:0 0 20px;
  }
  .fragcard::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--amber); opacity:.55;
  }
  .fr-k{
    font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--amber); margin-bottom:16px;
  }
  .fr-sha{color:#fde68a; font-size:17px; letter-spacing:1px}
  .fr-meta{color:var(--muted); font-size:12px; margin-top:3px}
  .fr-msg{
    color:#fde68a; font-style:italic; font-size:15.5px; line-height:1.75;
    margin:18px 0 0; padding:14px 0 0; border-top:1px dashed rgba(251,191,36,.25);
  }
  .fr-msg::before{content:"\201C"} .fr-msg::after{content:"\201D"}
  .fr-pips{display:flex; gap:6px; margin:22px 0 0}
  .fr-pips i{
    width:22px; height:4px; border-radius:2px; background:#334155; transition:background .4s ease;
  }
  .fr-pips i.on{background:var(--amber)}
  .fr-foot{color:var(--muted); font-size:11.5px; letter-spacing:.5px; margin-top:9px}

  /* ---- promotion + completion code (quest screens) ---- */
  .promo{border:1px solid rgba(192,132,252,.35); border-radius:8px; background:rgba(192,132,252,.06);
         padding:12px 16px; margin:14px 0}
  .promo-k{font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--purple)}
  .promo-r{margin-top:5px; color:var(--muted); font-size:15px}
  .promo-r b{color:var(--purple)}
  .fr-pips i.past{opacity:.4}
  .cando{margin:6px 0 14px; padding-left:20px; color:var(--text); font-size:13.5px}
  .cando li{margin:4px 0}
  .codebox{border:1px dashed var(--green-dim); border-radius:8px; background:#0b1220;
           padding:12px 16px; margin:14px 0; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .code-k{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); width:100%}
  .code-v{color:var(--green); font-size:17px; letter-spacing:1.5px; user-select:all}
  .codebox .btn{margin-left:auto}

  .chal{border:1px solid #334155; background:var(--panel); border-radius:8px; padding:16px 18px; margin:0 0 16px}
  .chal .tag{font-size:10px; letter-spacing:2px; color:var(--purple); text-transform:uppercase}
  .chal .q{margin:8px 0 12px; color:#f8fafc}
  .opts{display:flex; flex-direction:column; gap:8px}
  .opt{text-align:left; background:#090d16; border:1px solid var(--line); color:var(--text);
       font-family:inherit; font-size:14px; padding:10px 13px; border-radius:6px; cursor:pointer; transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--green-dim); background:#0e1a22; transform:translateX(3px)}
  .opt:disabled{cursor:default; opacity:.55}
  .opt.right{border-color:var(--green); color:var(--green); opacity:1; background:rgba(74,222,128,.08)}
  .opt.wrong{border-color:var(--red); color:var(--red); opacity:1}

  .shape{color:var(--muted); font-size:12.5px; margin:2px 0 8px}
  .shape em{color:var(--cyan); font-style:normal}
  .term{display:flex; align-items:center; gap:8px; background:#090d16; border:1px solid var(--line);
        border-radius:6px; padding:9px 12px}
  .term span{color:var(--green); font-weight:700}
  .term input{flex:1; background:transparent; border:0; outline:0; color:var(--green);
              font-family:inherit; font-size:14.5px; min-width:0}

  .bank{display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; align-items:center}
  .bank .lab{font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); width:100%}
  .tok{background:#0b1220; border:1px solid #334155; color:var(--amber); font-family:inherit;
       font-size:13px; padding:5px 11px; border-radius:14px; cursor:pointer; transition:.12s}
  .tok:hover:not(:disabled){border-color:var(--green); color:var(--green); transform:translateY(-1px)}
  .tok:disabled{opacity:.3; cursor:default}
  .tok.used{opacity:.35}

  .blank{background:#0b1220; border:1px solid #334155; border-bottom:2px solid var(--amber);
         color:var(--amber); font-family:inherit; font-size:13.5px; padding:1px 6px; border-radius:4px; outline:0}
  .blank:focus{border-color:var(--green); box-shadow:0 0 0 2px rgba(74,222,128,.15)}
  .blank.ok{border-color:var(--green); color:var(--green); border-bottom-color:var(--green)}
  .blank.no{border-color:var(--red); color:var(--red); border-bottom-color:var(--red)}

  /* ---- code editor for "type it yourself" ---- */
  .edwrap{border:1px solid #334155; border-radius:6px; overflow:hidden; margin-top:6px; background:#090d16}
  .edbar{display:flex; align-items:center; gap:10px; padding:6px 12px; background:#16213a;
         border-bottom:1px solid var(--line); font-size:11px; color:var(--muted); letter-spacing:1px}
  .edbar b{color:var(--amber); font-weight:400}
  textarea.editor{
    display:block; width:100%; min-height:230px; background:transparent; border:0; outline:0; resize:vertical;
    color:#a5f3fc; font-family:inherit; font-size:13.5px; line-height:1.7; padding:12px 14px; tab-size:2;
  }
  textarea.editor::placeholder{color:#334155}

  .reqs{margin-top:12px; border:1px solid var(--line); border-radius:6px; background:#090d16; padding:10px 14px}
  .reqs .lab{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
  .req{display:flex; gap:9px; align-items:flex-start; padding:3px 0; font-size:13px; color:var(--muted)}
  .req .mk{width:14px; flex:none; text-align:center}
  .req.on{color:#6ee7b7} .req.on .mk{color:var(--green)}
  .req.off .mk{color:#334155}
  .parseerr{border:1px solid #7f1d1d; background:rgba(248,113,113,.09); color:#fca5a5;
            border-radius:6px; padding:10px 13px; margin-top:11px; font-size:13px}

  .runout{background:#0b1220; border:1px solid var(--green-dim); border-radius:6px; padding:12px 14px;
          margin-top:12px; color:#a5f3fc; font-size:12.5px; line-height:1.6; white-space:pre-wrap; overflow-x:auto}
  .runout .rk{color:var(--cyan)} .runout .rc{color:var(--amber)} .runout .rg{color:var(--green)}
  .runout .rr{color:var(--red)} .runout .ry{color:var(--muted)}

  .row{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap}
  .btn{background:var(--green); color:#04150b; border:0; font-family:inherit; font-weight:700;
       font-size:13px; padding:9px 18px; border-radius:6px; cursor:pointer; letter-spacing:.5px}
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400}
  .btn.ghost:hover{color:var(--amber); border-color:var(--amber)}
  .btn:disabled{opacity:.4; cursor:default; filter:none}

  .fb{border-radius:6px; padding:11px 14px; margin:10px 0 0; font-size:13.5px; animation:fade .3s ease both}
  .fb.good{background:rgba(74,222,128,.09); border:1px solid var(--green-dim); color:#6ee7b7}
  .fb.bad{background:rgba(248,113,113,.09); border:1px solid #7f1d1d; color:#fca5a5}
  .fb.hint{background:rgba(251,191,36,.08); border:1px solid #a16207; color:#fde68a}
  .fb b{color:inherit}
  .fb .lead{display:block; margin-bottom:5px}
  .fb ul{margin:6px 0 0; padding-left:18px}
  .fb li{margin:3px 0}

  .veil{position:fixed; inset:0; z-index:60; background:rgba(2,6,23,.92); backdrop-filter:blur(4px);
        display:flex; align-items:center; justify-content:center; padding:22px; overflow-y:auto}
  .card{background:var(--panel); border:1px solid var(--green-dim); border-radius:10px;
        padding:26px 30px; max-width:700px; width:100%; max-height:88vh; overflow-y:auto}
  .card h1{margin:0 0 4px; font-size:28px; color:var(--green); letter-spacing:3px}
  .card h2{margin:0 0 14px; font-size:15px; color:var(--amber); letter-spacing:1px; font-weight:400}
  .card p{color:var(--text); font-size:14px}
  .card .dim{color:var(--muted); font-size:13px}
  .letter{border-left:2px solid var(--amber); padding:2px 0 2px 16px; margin:14px 0;
          color:#fde68a; font-size:14px; white-space:pre-wrap; line-height:1.75}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .chip{background:#090d16; border:1px solid var(--line); color:var(--muted); border-radius:6px;
        padding:7px 11px; font-size:12px; cursor:pointer; font-family:inherit}
  .chip:hover{border-color:var(--green-dim); color:var(--green)}
  .chip.done{color:var(--green); border-color:var(--green-dim)}
  .chip.locked{opacity:.35; cursor:not-allowed}
  table.cheat{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px}
  table.cheat td{padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top}
  table.cheat td:first-child{color:var(--amber); white-space:nowrap; width:36%}
  @media(max-width:640px){
    body{font-size:14px}
    .stats{gap:10px} .stat b{font-size:13px} .bar{width:70px}
    main{padding:16px 12px 40px}
    .card{padding:20px 18px}
    .walk td:first-child{width:auto; display:block; border-bottom:0}
    .walk td:last-child{display:block; padding-top:0}
  }

  /* --- NerdLab embed ---------------------------------------------------
     The platform viewer forces html/body to height:auto, so the lab owns its
     own viewport through this shell. That keeps `main` scrolling internally
     and keeps position:fixed overlays inside the visible frame.
     Everything below overrides the standalone styling above, so the lab uses
     the full width of the panel it sits in and borrows the platform's
     slate borders instead of its own green ones. */
  .questshell{ height:100vh; min-height:560px; display:flex; flex-direction:column; overflow:hidden; }
  body{ background:var(--bg); }
  body::after{ display:none; }   /* scanline overlay reads as noise on the platform */

  /* Use the width the panel actually gives us. */
  header{ padding:10px 28px; }
  main{ padding:26px 28px 64px; }
  .wrap{ max-width:1180px; }
  .card{ max-width:1040px; }

  /* Platform borders: slate outlines, one accent edge, no green boxes. */
  .card{ border-color:#334155; }
  .chaptercard{
    border-color:#334155;
    border-left-color:#38bdf8;
    background:linear-gradient(90deg, rgba(56,189,248,.07), transparent);
  }
  .brief{ border-left:4px solid #f59e0b; border-radius:0 8px 8px 0; }


  /* Structural boxes use slate too; green stays reserved for "you got it right". */
  .frag-scan{ border-left-color:#38bdf8; }
  .codebox{ border-color:#334155; }
  .runout{ border-color:#334155; }

  /* Wide screens read better with the walkthrough tables given more room. */
  @media (min-width:1000px){
    table.walk td:first-child{ width:30%; }
  }
</style>
</head>
<body>

<div class="questshell">
<header>
  <div class="brand">ANSIBLE&nbsp;QUEST<small>automation lead</small></div>
  <div class="stats">
    <div class="stat ch">CH<b id="s-ch">—</b></div>
    <div class="stat fr">FRAGMENTS<b id="s-fr">0/2</b></div>
    <div class="stat rank">RANK<b id="s-rank">Senior SRE</b></div>
    <div class="stat up">SERVERS UP<b id="s-up">100%</b><div class="bar"><i id="s-bar" style="width:100%"></i></div></div>
    <button class="hbtn" id="b-frag">Fragments</button>
    <button class="hbtn" id="b-note">Notebook</button>
    <button class="hbtn" id="b-map">Chapters</button>
  </div>
</header>

<main id="main"><div class="wrap" id="log"></div></main>
</div>

<script>
/* ============================================================
   ANSIBLE QUEST — "The Handover"
   Blank marker in fill-in code is @1@ … @9@  (avoids Jinja {{ }})
   ============================================================ */

const TUNE = { triesBeforeReveal:3, damage:4, revealXP:8 };

/* ===== QUEST CONFIG ===== */
const QUEST = { n:1, of:1, roman:'', title:'The Handover',
  rankStart:'Senior SRE', rankEnd:'Automation Lead',
  chFrom:1, chTo:2, chTotal:2, fragOffset:0, fragTotal:2,
  isFinal:true, next:'' };
const STORY_SO_FAR = 'You can already roll a change across four hundred machines without dropping a request. Meridian arrive in three days. There are database passwords in plain text in your repository, nobody can reproduce a run twice the same way, and a locked file left behind by the engineer who quit is still sitting on that desktop.';
const QUEST_GOAL   = 'Stop being the person who runs the playbooks and become the person who owns the platform. Two chapters, then a final lab: write the file that has to pass the pipeline, not just the run.';
const QUEST_CAN    = '<li>get secrets out of the repository and explain what vault does and does not protect</li><li>pin collections so a run in six months does the same thing as today</li><li>gate every change on lint, a converge and an idempotence check</li><li>turn a playbook into continuous drift detection instead of a one-off fix</li>';
const NEXT_UP      = '';
const START_LABEL  = 'Open the repository →';
/* ===== end quest config ===== */

/* ============================================================
   CONTENT
   ============================================================ */
const CHAPTERS = [
{
  id:1, title:"What Emma Locked", sub:"Secrets, and where they really belong",
  story:[
    "date:Day 8 · 08:00 · Meridian audit in 3 days",
    "sys:repo scan — 4 files contain credential-shaped strings",
    "out:$ grep -rn \"password\" group_vars/\ngroup_vars/databases.yml:12: db_password: Nerdlab2019!\ngroup_vars/all.yml:7:      api_token: sk-live-8f21c4ae91\ngroup_vars/prod.yml:23:   grafana_admin_pass: admin",
    "npc:PRIYA (CTO)|Every one of those is in git. Every one of them is in the history, which means deleting the line changes nothing. Meridian's auditor will find this in four minutes.",
    "npc:DEV (on-call)|We rotated that database password in 2021. It is still in the log from 2019. So is the one before it.",
    "There is a way to keep secrets in a repository and a way to keep them out of one. This chapter is about knowing which problem you have.",
    "npc:PRIYA (CTO)|And there is an envelope in Emma's exit paperwork. HR would not open it. It says: <i>for whoever can explain what is inside the vault file, and why I locked it instead of deleting it.</i>"
  ],
  brief:{
    h:"Field Manual — Secrets",
    lines:[
      "<b>Ansible Vault</b> encrypts a file at rest with a password. Encrypted, it is safe to commit; the playbook reads it transparently at run time.",
      "<code>ansible-vault create | encrypt | edit | view | rekey FILE</code>. Convention: keep encrypted values in <code>group_vars/&lt;group&gt;/vault.yml</code> and reference them from a plain <code>vars.yml</code>.",
      "Supply the password with <code>--ask-vault-pass</code> interactively, or <code>--vault-password-file</code> in automation.",
      "<code>no_log: true</code> hides a task's arguments and output from the log. Without it, a secret you carefully encrypted is printed in full by a failed task.",
      "What vault does <b>not</b> give you: per-secret rotation, an access log, or a way to share one value with a system that is not Ansible. Rotation is a commit; access is all-or-nothing.",
      "When those matter, the secret belongs in a manager — HashiCorp Vault, AWS Secrets Manager — and Ansible fetches it at run time with a <b>lookup</b>. Nothing sensitive is ever in the repo."
    ],
    code:"# group_vars/prod/vault.yml   (encrypted at rest)\n$ANSIBLE_VAULT;1.1;AES256\n35316264623437333064666532653834...\n\n# in the play\n  vars_files:\n    - group_vars/prod/vault.yml\n\n  tasks:\n    - name: Write the application credentials\n      ansible.builtin.template:\n        src: app.env.j2\n        dest: /etc/app/app.env\n        mode: \"0600\"\n      no_log: true",
    annot:[
      ["$ANSIBLE_VAULT;1.1;AES256","The header of an encrypted file. Safe to commit — useless without the password."],

    lines:[
      "<b>Collections</b> are how modules ship. Write them fully qualified — <code>ansible.builtin.copy</code>, <code>community.general.haproxy</code> — so resolution is deterministic and dependencies are visible.",
      "<code>requirements.yml</code> lists the collections a repo needs. <b>Pin exact versions.</b> A range means a run next month can behave differently with no commit.",
      "<b>ansible-lint</b> enforces the house style. <code>profile: production</code> is the strict ruleset; <code>warn_list</code> keeps known debt visible, <code>skip_list</code> silences it.",
      "<b>Molecule</b> tests a role for real: <code>create → converge → idempotence → verify → destroy</code>. <code>molecule converge</code> is the fast inner loop; <code>molecule test</code> is the gate.",
      "The <b>idempotence</b> stage is the highest-value automated test in Ansible: it runs the role twice and fails if anything reports changed.",
      "An <b>execution environment</b> is a container image holding ansible-core, the pinned collections and their Python dependencies — built with <code>ansible-builder</code>, run identically on a laptop and in the controller.",
      "<b>Drift detection</b>: schedule the same playbook with <code>--check --diff</code>. Anything reported as <i>would change</i> is a machine somebody edited by hand."
    ],

  q:"Write <code>site.yml</code>: one play on <code>webservers</code>, <code>become: true</code>, loading <code>group_vars/prod/vault.yml</code> via <code>vars_files:</code>. Tasks: install <code>nginx</code> (<b>present</b>); write the credentials file from a template with <code>mode: \"0600\"</code> and <code>no_log: true</code>; render the nginx config from a template with a <code>mode:</code> and a <code>notify:</code>; ensure the service is <b>started and enabled</b>. Add the matching handler. Every module fully qualified.",
  file:"site.yml",
  placeholder:"---\n- name: \n  hosts: webservers\n  become: true\n\n  vars_files:\n    - \n\n  tasks:\n    - name: \n      ansible.builtin.package:\n\n  handlers:\n    - name: \n",
  hint:"Four tasks and one handler. Fully qualified names everywhere — <code>ansible.builtin.package</code>, <code>ansible.builtin.template</code>, <code>ansible.builtin.service</code>. The credentials task carries <code>mode: \"0600\"</code> and <code>no_log: true</code> as a task key. The config task carries <code>mode: \"0644\"</code> and <code>notify:</code> matching your handler name exactly. Use <code>state: present</code>, never <code>latest</code>, and put no password literal anywhere in the file.",
  solution:'---\n- name: Web tier — audit build\n  hosts: webservers\n  become: true\n\n  vars_files:\n    - group_vars/prod/vault.yml\n\n  tasks:\n    - name: Nginx is installed\n      ansible.builtin.package:\n        name: nginx\n        state: present\n      tags: packages\n\n    - name: Application credentials are in place\n      ansible.builtin.template:\n        src: app.env.j2\n        dest: /etc/nginx/app.env\n        owner: root\n        mode: "0600"\n      no_log: true\n      notify: Restart nginx\n      tags: config\n\n    - name: Nginx config is rendered from the template\n      ansible.builtin.template:\n        src: nginx.conf.j2\n        dest: /etc/nginx/nginx.conf\n        mode: "0644"\n      notify: Restart nginx\n      tags: config\n\n    - name: Nginx is running and enabled\n      ansible.builtin.service:\n        name: nginx\n        state: started\n        enabled: true\n      tags: service\n\n  handlers:\n    - name: Restart nginx\n      ansible.builtin.service:\n        name: nginx\n        state: restarted',
  check(doc){
    const p  = Y.play(doc);
    const ts = Y.tasks(p);
    const vf = p ? Y.list(p.vars_files) : [];
    const pk = Y.anyMod(p,['package','apt','dnf','yum'])[0];
    const tps= ts.filter(t=> Y.mod(t).short === 'template');
    const sec= tps.filter(t=> Y.yes(t.no_log))[0];
    const cfg= tps.filter(t=> t.notify)[0];
    const sv = Y.anyMod(p,['service','systemd']).filter(t=> !Y.eq(Y.arg(t,'state'),'restarted'))[0];
    const hs = Y.handlers(p);
    return [
      req(!!(p && Y.eq(p.hosts,'webservers') && Y.yes(p.become)), '<code>hosts: webservers</code> with <code>become: true</code>'),
      req(vf.some(f=> /vault/.test(String(f))), '<code>vars_files:</code> loads the vault file'),
      req(!!(pk && Y.eq(Y.arg(pk,'name'),'nginx') && Y.eq(Y.arg(pk,'state'),'present')), '<code>nginx</code> installed with <code>state: present</code>'),
      req(tps.length >= 2, 'Two <code>template</code> tasks — credentials and config'),
      req(!!sec, 'One of them has <code>no_log: true</code>'),
      req(!!(sec && String(Y.arg(sec,'mode')) === '0600'), 'The credentials file is <code>mode: "0600"</code>'),
      req(!!cfg, 'The config template has a <code>notify:</code>'),
      req(hs.length >= 1 && !!cfg && hs.some(h=> Y.eq(h.name, cfg.notify)), 'A handler whose name matches that <code>notify:</code>'),
      req(hs.some(h=> Y.eq(Y.arg(h,'state'),'restarted')), 'The handler restarts nginx'),
      req(!!(sv && Y.eq(Y.arg(sv,'state'),'started') && Y.yes(Y.arg(sv,'enabled'))), 'The service is <code>started</code> and <code>enabled</code>'),
      req(ts.length >= 4 && ts.every(t=> t && t.name), 'Every task has a <code>name:</code>')
    ];
  },
  /* the CI gate — style and safety rules, checked on the raw file */
  lint(doc, raw){
    const p  = Y.play(doc);
    const ts = Y.tasks(p).concat(Y.handlers(p));
    const fileTasks = ts.filter(t=> ['template','copy','file','lineinfile'].indexOf(Y.mod(t).short) >= 0);
    const secretish = /(^|\s)(\w*(password|passwd|secret|token|api_key|apikey))\s*:\s*["']?[^\s"'{][^\s"']{3,}/im;
    return [
      req(ts.length > 0 && ts.every(t=> t && t.name), 'name[missing] — every task and handler is named'),
      req(ts.every(t=> /\./.test(String(Y.mod(t).key || ''))), 'fqcn[action-core] — every module is fully qualified'),
      req(!ts.some(t=> Y.eq(Y.arg(t,'state'),'latest')), 'package-latest — no <code>state: latest</code> in production code'),
      req(!ts.some(t=> ['command','shell'].indexOf(Y.mod(t).short) >= 0 && t.changed_when === undefined),
          'no-changed-when — no <code>command</code>/<code>shell</code> without <code>changed_when</code>'),
      req(fileTasks.length > 0 && fileTasks.every(t=> Y.arg(t,'mode') !== undefined && Y.arg(t,'mode') !== null),
          'risky-file-permissions — every file written sets an explicit <code>mode:</code>'),
      req(!secretish.test(String(raw||'')), 'secrets — no credential literal in the playbook'),
      req(ts.some(t=> Y.yes(t.no_log)), 'no-log-password — the task carrying the secret sets <code>no_log</code>')
    ];
  },

/* ============================================================
   A small YAML reader.
   It understands the subset playbooks are written in: lists,
   key/value maps, nesting by indentation, comments and quotes.
   It reports the LINE NUMBER of a mistake, which is most of
   what makes the feedback useful.
   ============================================================ */
function parseYAML(text){
  if(/\t/.test(text)){
    const ln = text.split('\n').findIndex(l=> l.indexOf('\t') >= 0) + 1;
    throw {line:ln, msg:'There is a TAB character on this line. YAML never allows tabs for indentation — use spaces.'};
  }
  const raw = text.split('\n');
  const L = [];                                   // {text, n} with blanks/comments removed
  raw.forEach((l,idx)=>{
    const stripped = l.replace(/\s+$/,'');
    const t = stripped.trim();
    if(t === '' || t.charAt(0) === '#' || t === '---' || t === '...') return;
    L.push({text: stripped, n: idx+1});
  });
  if(!L.length) throw {line:1, msg:'The file is empty. Nothing to run.'};

  let i = 0;
  const ind  = s => s.match(/^ */)[0].length;
  const unq  = v => {
    v = v.trim();
    const c = v.charAt(0);
    if((c === '"' || c === "'") && v.charAt(v.length-1) === c) return v.slice(1,-1);
    return v;
  };
  const isItem = s => /^\s*-(\s|$)/.test(s);

  function block(col){
    if(i >= L.length) return null;
    return isItem(L[i].text) ? seq(col) : map(col);
  }
  function seq(col){
    const arr = [];
    while(i < L.length){
      const {text, n} = L[i], cur = ind(text);
      if(cur < col) break;
      if(cur > col) throw {line:n, msg:'This line is indented too far for the list it belongs to.'};
      if(!isItem(text)) break;
      const m = text.match(/^(\s*)-\s*(.*)$/);
      const rest = m[2];
      if(rest === ''){                              // "-" alone: block on the next line
        i++;
        if(i < L.length && ind(L[i].text) > col) arr.push(block(ind(L[i].text)));
        else arr.push(null);
      } else if(/^[^:#]+:(\s|$)/.test(rest)){       // "- key: value" starts a map
        const contentCol = text.indexOf(rest, m[1].length);
        L[i] = {text: ' '.repeat(contentCol) + rest, n};   // rewrite, do not advance
        arr.push(map(contentCol));
      } else {
        arr.push(unq(rest));                        // plain list item
        i++;
      }
    }
    return arr;
  }
  function map(col){
    const obj = {};
    while(i < L.length){
      const {text, n} = L[i], cur = ind(text);
      if(cur < col) break;
      if(cur > col) throw {line:n, msg:'This line is indented further than the line above it, but nothing here opens a new block.'};
      if(isItem(text)) break;
      const m = text.match(/^\s*([^:#]+?)\s*:\s*(.*)$/);
      if(!m) throw {line:n, msg:'This line is not <code>key: value</code>. Every mapping line needs a colon and a space after it.'};
      const key = m[1].trim();
      const val = m[2].trim();
      if(Object.prototype.hasOwnProperty.call(obj, key))
        throw {line:n, msg:'The key <code>'+key+'</code> appears twice at the same level. Each key may appear only once.'};
      i++;
      if(val === '' || val.charAt(0) === '#'){
        if(i < L.length && ind(L[i].text) > cur)                    obj[key] = block(ind(L[i].text));
        else if(i < L.length && ind(L[i].text) === cur && isItem(L[i].text)) obj[key] = seq(cur);
        else obj[key] = null;
      } else {
        obj[key] = unq(val);
      }
    }
    return obj;
  }
  const doc = block(ind(L[0].text));
  if(i < L.length) throw {line:L[i].n, msg:'This line does not line up with anything above it. Check the indentation.'};
  return doc;
}

/* ---------- helpers used by every checker ---------- */
const NOT_MODULE = ['name','when','loop','notify','become','become_user','tags','args','register',
                    'vars','with_items','loop_control','ignore_errors','delegate_to','changed_when','failed_when'];
const Y = {
  plays(doc){ return Array.isArray(doc) ? doc : (doc && typeof doc === 'object' ? [doc] : []); },
  play(doc){ return Y.plays(doc)[0] || null; },
  list(v){ return Array.isArray(v) ? v : []; },
  tasks(p){ return p ? Y.list(p.tasks) : []; },
  handlers(p){ return p ? Y.list(p.handlers) : []; },
  mod(t){
    if(!t || typeof t !== 'object') return {key:null, short:null, val:null};
    for(const k of Object.keys(t)){
      if(NOT_MODULE.indexOf(k) === -1)
        return {key:k, short:k.replace(/^ansible\.builtin\./,''), val:t[k]};
    }
    return {key:null, short:null, val:null};
  },
  byMod(p, short){ return Y.tasks(p).filter(t=> Y.mod(t).short === short); },
  anyMod(p, shorts){ return Y.tasks(p).filter(t=> shorts.indexOf(Y.mod(t).short) >= 0); },
  arg(t, k){ const v = Y.mod(t).val; return (v && typeof v === 'object') ? v[k] : undefined; },
  yes(v){ return ['true','yes','on','True','Yes'].indexOf(String(v)) >= 0; },
  eq(a,b){ return String(a==null?'':a).trim().toLowerCase() === String(b).toLowerCase(); },
  jinja(v, name){ const s = String(v==null?'':v); return new RegExp('\\{\\{\\s*'+name+'\\s*\\}\\}').test(s); }
};
const req = (ok, text) => ({ok:!!ok, text:text});

/* ============================================================
   THE SIMULATOR — pretends to run a playbook against 2 hosts
   ============================================================ */
/* The test fleet. Each machine knows which groups it belongs to and what
   family it runs, which is all that hosts: and when: need to behave
   the way they would against real servers. A lab may supply its own. */
const SIM_FLEET = [
  {name:'web01.nerdlab.co.in', groups:['webservers'], os_family:'Debian', distro:'Ubuntu'},
  {name:'web02.nerdlab.co.in', groups:['webservers'], os_family:'Debian', distro:'Ubuntu'},
  {name:'db01.nerdlab.co.in',  groups:['databases'],  os_family:'Debian', distro:'Ubuntu'}
];

function simFleet(){ return (typeof LAB !== 'undefined' && LAB && LAB.fleet) ? LAB.fleet : SIM_FLEET; }

function simHosts(pattern){
  const p = String(pattern == null ? 'all' : pattern).trim();
  const fleet = simFleet();
  if(p === 'all' || p === '') return fleet;
  return fleet.filter(h=> h.name === p || h.name.split('.')[0] === p || h.groups.indexOf(p) >= 0);
}

/* Enough of a Jinja reader to resolve the conditions this course teaches. */
function simWhen(expr, host){
  if(expr == null) return true;
  const s = String(expr);
  const fam = s.match(/os_family[^=!]*([=!]=)\s*["']?([A-Za-z]+)/);
  if(fam) return fam[1] === '==' ? host.os_family === fam[2] : host.os_family !== fam[2];
  const dis = s.match(/distribution[^=!]*([=!]=)\s*["']?([A-Za-z]+)/);
  if(dis) return dis[1] === '==' ? host.distro === dis[2] : host.distro !== dis[2];
  return true;
}

function pad(label, width){
  const n = Math.max(4, width - label.length - 1);
  return label + ' ' + '*'.repeat(n);
}
function simulate(doc, runNo){
  const out = [];
  const plays = Y.plays(doc);
  if(!plays.length) return ['ERROR! playbook must be a list of plays'];
  const order = [], recap = {};
  const touch = h =>{
    if(!recap[h.name]){ recap[h.name] = {ok:0, changed:0, skipped:0}; order.push(h.name); }
    return recap[h.name];
  };
  const first = runNo === 1;

  plays.forEach((play, pi)=>{
    if(pi) out.push('');
    const hosts = simHosts(play.hosts);
    out.push('<span class="rk">'+pad('PLAY ['+(play.name || 'play')+']', 60)+'</span>');
    out.push('');
    if(!hosts.length){
      out.push('<span class="ry">skipping: no hosts matched \''+String(play.hosts)+'\'</span>');
      return;
    }
    out.push('<span class="rk">'+pad('TASK [Gathering Facts]', 60)+'</span>');
    hosts.forEach(h=>{ out.push('<span class="rg">ok: ['+h.name+']</span>'); touch(h).ok++; });

    const notified = [];
    Y.tasks(play).forEach(t=>{
      const m = Y.mod(t);
      if(!m.short) return;
      out.push('');
      out.push('<span class="rk">'+pad('TASK ['+(t.name || m.short)+']', 60)+'</span>');

      /* is this task idempotent on a second run? */
      let changes;
      if(first) changes = true;
      else if(['apt','dnf','yum','package'].indexOf(m.short) >= 0 && Y.eq(Y.arg(t,'state'),'latest')) changes = true;
      else if((m.short === 'command' || m.short === 'shell') && !(t.args && t.args.creates)) changes = true;
      else changes = false;
      if(m.short === 'debug') changes = false;

      const items = Y.list(t.loop);
      hosts.forEach(h=>{
        if(!simWhen(t.when, h)){
          out.push('<span class="ry">skipping: ['+h.name+']</span>');
          touch(h).skipped++;
          return;
        }
        const targets = items.length ? items : [null];
        targets.forEach(it=>{
          const suffix = it === null ? '' : ' => (item='+it+')';
          if(m.short === 'debug'){
            const msg = (m.val && typeof m.val === 'object') ? (m.val.msg || '') : '';
            out.push('<span class="rg">ok: ['+h.name+'] => {</span>');
            out.push('<span class="rg">    "msg": "'+String(msg)
              .replace(/\{\{\s*ansible_hostname\s*\}\}/g, h.name.split('.')[0])
              .replace(/\{\{\s*ansible_facts\[.os_family.\]\s*\}\}/g, h.os_family)+'"</span>');
            out.push('<span class="rg">}</span>');
            touch(h).ok++;
          } else if(changes){
            out.push('<span class="rc">changed: ['+h.name+']'+suffix+'</span>');
            touch(h).ok++; touch(h).changed++;
            if(t.notify && notified.indexOf(t.notify) === -1) notified.push(t.notify);
          } else {
            out.push('<span class="rg">ok: ['+h.name+']'+suffix+'</span>');
            touch(h).ok++;
          }
        });
      });
    });

    Y.handlers(play).forEach(hd=>{
      if(notified.indexOf(hd.name) === -1) return;
      out.push('');
      out.push('<span class="rk">'+pad('RUNNING HANDLER ['+hd.name+']', 60)+'</span>');
      hosts.forEach(host=>{
        out.push('<span class="rc">changed: ['+host.name+']</span>');
        touch(host).ok++; touch(host).changed++;
      });
    });
  });

  out.push('');
  out.push('<span class="rk">'+pad('PLAY RECAP', 60)+'</span>');
  order.forEach(n=>{
    const r = recap[n];
    out.push('<span class="'+(r.changed?'rc':'rg')+'">'+n.padEnd(24)+
             ': ok='+r.ok+'    changed='+r.changed+'    unreachable=0    failed=0    skipped='+r.skipped+'</span>');
  });
  return out;
}

function screen(){ log.innerHTML = ''; }
function focusQuiet(el){ if(!el) return; try{ el.focus({preventScroll:true}); }catch(e){} }
function toTop(){
  main.scrollTop = 0;
  requestAnimationFrame(()=>{ main.scrollTop = 0; requestAnimationFrame(()=>{ main.scrollTop = 0; }); });
}

function nextBtn(label, fn){

  r.appendChild(b); log.appendChild(r);

function line(part){
  if(part.startsWith('date:'))      add(part.slice(5).trim(),'dateline');
  else if(part.startsWith('sys:'))  add(md(part.slice(4).trim()),'sys');
  else if(part.startsWith('out:'))  add(esc(part.slice(4)).replace(/\n/g,'<br>'),'out');
  else if(part.startsWith('npc:')){
    const body = part.slice(4), cut = body.indexOf('|');
    add('<b>'+body.slice(0,cut)+':</b> '+md(body.slice(cut+1)),'npc');
  }
  else add(md(part),'narr');
}

/* Rank is earned by finishing the quest — every chapter plus the capstone —
   not accumulated from XP. XP is the score; the rank is the qualification. */
function rankOf(){ return (S.done.length >= CHAPTERS.length && S.labDone) ? QUEST.rankEnd : QUEST.rankStart; }

/* A short code the student can hand in. The trailing letter is a checksum
   over the rest, so a casually edited score stops matching. */
function completionCode(){
  const core = 'ALEAD-'+S.xp+'-'+S.up+'-'+S.frags.length;
  let h = 7;
  for(let i=0;i<core.length;i++) h = (h*31 + core.charCodeAt(i)) % 26;
  return core+'-'+String.fromCharCode(65+h);
}
function hud(){
  document.getElementById('s-rank').textContent = rankOf();
  document.getElementById('s-up').textContent   = S.up + '%';
  document.getElementById('s-ch').textContent   = (S.lab ? 'LAB' : CHAPTERS[S.ch].id + '/' + QUEST.chTotal);
  document.getElementById('s-fr').textContent   = (QUEST.fragOffset + S.frags.length) + '/' + QUEST.fragTotal;
  const bar = document.getElementById('s-bar');
  bar.style.width = S.up + '%';
  bar.style.background = S.up > 70 ? 'var(--green)' : S.up > 35 ? 'var(--amber)' : 'var(--red)';
}
function award(n){ S.xp += n; hud(); }
function damage(n){
  S.up = Math.max(0, S.up - n); hud();
  if(S.up === 0){
    S.up = 60; hud();
    add("<b>Something broke.</b> Server uptime hit zero. Priya undoes the change, buys you a coffee, and puts the servers back to 60%. Nobody is fired. Nobody ever is. Keep going.", 'fb hint');
  }
}

function norm(s){ return String(s).replace(/[‘’“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase(); }
function normCmd(s){ return norm(s).replace(/^\$\s*/,'').replace(/"/g,'').replace(/'/g,''); }
function normFill(s){
  let t = norm(s).replace(/:$/,'').replace(/^["']|["']$/g,'');
  return t.replace(/\{\{\s*/g,'{{ ').replace(/\s*\}\}/g,' }}');
}
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);
